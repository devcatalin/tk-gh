apiVersion: ai.testkube.io/v1alpha1
kind: Skill
metadata:
  name: e2e-gitops-inline
spec:
  description: Writes and debugs k6 load tests. Use when a task mentions k6 or load tests.
  license: Apache-2.0
  allowed-tools: Bash(k6:*) Read
  content: |
    k6 scripts live in tests/load.
  testkube:
    alwaysInclude: true
