apiVersion: ai.testkube.io/v1alpha1
kind: AIAgent
metadata:
  name: e2e-agent
spec:
  displayName: E2E Agent
  description: GitOps revalidation agent, v7.
  instructions: 'You answer questions about the test executions of this environment.

    '
  defaultModel: gpt-4o
  labels:
    team: qa
  mcpServers:
  - name: testkube
    tools:
      list_executions:
        enabled: true
        autoApproved: true
  - name: e2e-perperson
    signIn: per_person
  skills:
  - name: issue-format
    description: Use when opening an issue.
    content: 'Title issues "Flaky: <workflow>" and link the execution.'
  skillRefs:
  - name: e2e-lib-skill
