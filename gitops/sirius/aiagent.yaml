apiVersion: ai.testkube.io/v1alpha1
kind: AIAgent
metadata:
  name: e2e-agent
spec:
  displayName: E2E Agent
  description: GitOps revalidation agent, v3 (mcpServers left out).
  instructions: 'You answer questions about the test executions of this environment.

    '
  defaultModel: gpt-4o
  labels:
    team: qa
  skills:
  - name: issue-format
    description: Use when opening an issue.
    content: 'Title issues "Flaky: <workflow>" and link the execution.'
  skillRefs:
  - name: e2e-lib-skill
