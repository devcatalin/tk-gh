apiVersion: ai.testkube.io/v1alpha1
kind: AIAgent
metadata:
  name: e2e-agent
spec:
  displayName: E2E Agent v2
  description: GitOps end-to-end check agent, updated by commit (after the server
    delete).
  instructions: 'You answer questions about the test executions of this environment.

    '
  defaultModel: gpt-4o
  labels:
    team: qa
  mcpServers:
  - name: testkube
    tools:
      list_executions:
        enabled: true
        autoApproved: true
  - name: e2e-shared
    signIn: shared_key
    credentialReference: secret://e2e-mcp-headers
    tools:
      ask_question:
        enabled: true
  skills:
  - name: flaky-triage
    description: Use when an execution failed only some of the time.
    content: Compare the last ten executions before calling a test flaky.
    alwaysInclude: true
  - name: issue-format
    description: Use when opening an issue.
    content: 'Title issues "Flaky: <workflow>" and link the execution.'
